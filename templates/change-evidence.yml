# change-evidence, shadow mode: reports on every PR, never blocks a merge.
#
# Trust model (docs/security.md has the full threat model):
# - Two workflows. change-evidence-trigger.yml runs on pull_request with no permissions and
#   does nothing. When it finishes, GitHub starts THIS workflow via workflow_run, using the
#   copy on the DEFAULT BRANCH: a PR can't edit the workflow that judges it.
# - Nothing from the trigger run is consumed. The reporter re-derives everything from the
#   event GitHub generates, validates it, and cross-checks it against the API (the PR must
#   be open on this repository with exactly this head commit).
# - The PR's commits are fetched as git objects and read as data. They are never checked
#   out, installed, built or run: do NOT add a step that does. The policy overlay
#   (.change-evidence.json) is read from the base branch tip.
# - The evaluator is an exact npm version whose tarball must match a pinned sha512 before
#   it runs. It has no dependencies, so nothing is installed and no install scripts run.
# - All Actions are pinned to commit SHAs. Credentials aren't persisted to .git/config.
name: change-evidence

on:
  workflow_run:
    workflows: [change-evidence-trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: write # the sticky report comment
  statuses: write # an informational "change-evidence" commit status

concurrency:
  group: change-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  CHANGE_EVIDENCE: "@semeton/change-evidence@0.0.0"
  CHANGE_EVIDENCE_INTEGRITY: "sha512-PLACEHOLDER"

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the evaluator and verify it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p change-evidence && cd change-evidence
          npm pack --json --silent "$CHANGE_EVIDENCE" > pack.json
          got=$(node -p "require('./pack.json')[0].integrity")
          if [ "$got" != "$CHANGE_EVIDENCE_INTEGRITY" ]; then
            echo "::error::$CHANGE_EVIDENCE does not match the pinned integrity (got $got)"
            exit 1
          fi
          tar -xzf "$(node -p "require('./pack.json')[0].filename")"

      # The default branch: never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node change-evidence/package/bin/change-evidence.js github-report --workspace "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/ce"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: change-evidence
          path: ${{ runner.temp }}/ce/
          if-no-files-found: ignore
          retention-days: 90
